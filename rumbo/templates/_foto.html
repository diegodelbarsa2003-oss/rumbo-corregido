{# Foto de un destino. Si la imagen no carga, queda el degradado con el nombre. #}
{% macro foto(nombre, guardada="", clase="") %}
{% set url = foto_destino(nombre, guardada) %}
<div class="foto {{ clase }}" data-nombre="{{ nombre }}" role="img" aria-label="Foto de {{ nombre }}">
  {% if url %}<img src="{{ url }}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">{% endif %}
  <span class="foto__nombre">{{ nombre }}</span>
</div>
{% endmacro %}
